<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>宇哥資優自然｜透鏡成像實驗室</title><style>
*{box-sizing:border-box}body{margin:0;background:#edf4fa;color:#18334e;font:17px/1.6 system-ui,sans-serif}main{max-width:1200px;margin:auto;padding:20px}header{background:#143d60;color:white;padding:24px;border-radius:18px}h1{margin:0;font-size:clamp(24px,4vw,36px)}section{background:white;border-radius:16px;padding:18px;margin-top:16px;box-shadow:0 3px 16px #173d6012}svg{width:100%;height:auto;display:block;touch-action:none;background:#f8fbff;border-radius:12px}button,select{font:inherit;padding:8px 14px;border:1px solid #adc5d8;border-radius:9px;background:white;color:#18334e;cursor:pointer}button:hover{background:#e2f1ff}input[type=range]{width:100%;accent-color:#147ca8}.controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px}.buttons{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.results{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}.results div{background:#edf5fb;padding:12px;border-radius:10px}.results strong{display:block;font-size:22px}label{display:block}small{color:#526d85} .legend{display:flex;flex-wrap:wrap;gap:16px} main{max-width:1600px;padding:12px}header{padding:12px 20px}section{padding:12px;margin-top:10px}.labgrid{display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:12px;align-items:start}.labgrid #results{margin:0;box-shadow:none;background:#f1f6fb}.results{grid-template-columns:1fr 1fr;gap:6px}.results strong{font-size:19px}.results div{padding:8px}svg{max-height:57vh}.legend{gap:8px 14px;font-size:15px}.screenctl{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.screenctl input[type=range]{width:180px}button:focus-visible{outline:3px solid #1298ce}@media(max-width:750px){.labgrid{grid-template-columns:1fr}svg{max-height:none}.results{grid-template-columns:repeat(2,1fr)}} </style><main><header><small style="color:#c7e6ff">宇哥資優自然 · 八年級理化</small><h1>透鏡成像互動實驗室</h1>拖曳物體，探索光線與成像的關係。</header><section><div class="controls"><label>透鏡種類<select id="kind"><option value="1">凸透鏡</option><option value="-1">凹透鏡</option></select></label><label>物距：<output id="uo"></output> cm<input id="u" type="range" min="2" max="40" step=".1" value="15"></label><label>焦距：<output id="fo"></output> cm<input id="f" type="range" min="5" max="15" step=".1" value="10"></label><label>物高：<output id="ho"></output> cm<input id="h" type="range" min="1" max="5" step=".1" value="3"></label></div><div class="buttons" id="presets"><button data-k="2.5">2F 外</button><button data-k="2">2F 上</button><button data-k="1.5">F～2F</button><button data-k="1">F 上</button><button data-k=".6">F 內</button><button id="reset">重設</button><button id="full">全螢幕</button></div><div class="screenctl"><label><input type="checkbox" id="screen"> 顯示光屏</label><label>光屏距離 <output id="so"></output> cm <input id="sd" type="range" min="1" max="100" step=".1" value="30"></label><button id="focus">光屏移至像的位置</button><button id="animate">播放光線動畫</button></div><div class="labgrid"><div><svg id="scene" viewBox="0 0 1000 520" aria-label="透鏡光路圖"></svg><div class="legend"><label style="color:#dc3535"><input type="checkbox" id="r0" checked>平行主軸</label><label style="color:#15804c"><input type="checkbox" id="r1" checked>通過鏡心</label><label style="color:#2563eb"><input type="checkbox" id="r2" checked>通過焦點方向</label><label><input type="checkbox" id="ext" checked>虛像延長線</label><label><input type="checkbox" id="answer" checked>顯示答案</label></div></div><section id="results"><div class="results"><div>成像性質<strong id="type"></strong></div><div>大小<strong id="size"></strong></div><div>像距<strong id="dist"></strong></div><div>倍率<strong id="mag"></strong></div></div><p id="note"></p><p id="screenNote"></p></section></div></section><section><b>三條特殊光線</b><p>凸透鏡：平行主軸的光線折射後通過另一側焦點；通過鏡心的光線方向不變；通過物體側焦點（或其延長線）的光線折射後平行主軸。凹透鏡：平行入射光的反向延長線通過同側焦點；鏡心光線直行；朝另一側焦點入射的光線折射後平行主軸。</p><small>採理想薄透鏡模型，非厚透鏡的精確折射模擬。虛線表示光線反向延長線。</small></section></main><script>
const $=id=>document.getElementById(id),svg=$('scene'),X=500,Y=260;let scale=10,drag=false,dragScale=10,playing=false;
function render(){const u=+$('u').value,f=+$('f').value,h=+$('h').value,F=f*+$('kind').value,inf=Math.abs(u-F)<1e-8,v=inf?Infinity:F*u/(u-F),m=-v/u,show=$('answer').checked;const sd=+$('sd').value;let a3=inf?0:h*F/(F-u);if(!drag)scale=Math.min(18,440/Math.max(u,2*f,inf?0:Math.min(500,Math.abs(v)), $('screen').checked?sd:0),200/Math.max(h,inf?0:Math.min(200,Math.abs(m*h)),Math.min(200,Math.abs(a3))));if(!Number.isFinite(scale))scale=10;$('so').value=sd.toFixed(1);
$('uo').value=u.toFixed(1);$('fo').value=f.toFixed(1);$('ho').value=h.toFixed(1);
const px=x=>X+x*scale,py=y=>Y-y*scale;let s='<defs><clipPath id="clip"><rect x="12" y="12" width="976" height="496"/></clipPath></defs>';
const line=(x1,y1,x2,y2,c,w=2,d='')=>'<line x1="'+px(x1)+'" y1="'+py(y1)+'" x2="'+px(x2)+'" y2="'+py(y2)+'" stroke="'+c+'" stroke-width="'+w+'" '+(d?'stroke-dasharray="'+d+'"':'')+'/>';
const label=(x,y,t,c='#344b60')=>'<text x="'+px(x)+'" y="'+py(y)+'" fill="'+c+'" text-anchor="middle" font-size="16">'+t+'</text>';
let limit=485/scale;s+=line(-limit,0,limit,0,'#8294a6',1.5);s+=F>0?'<path d="M500 60 Q540 260 500 460 Q460 260 500 60Z" fill="#c2e5fa" stroke="#4b9bcc" opacity=".8"/>':'<path d="M480 60 Q510 260 480 460 L520 460 Q490 260 520 60Z" fill="#c2e5fa" stroke="#4b9bcc" opacity=".8"/>';
s+=line(0,-200/scale,0,200/scale,'#76a9cc',1,'5 4');for(const k of [-2,-1,1,2]){s+='<circle cx="'+px(k*f)+'" cy="260" r="4" fill="#344b60"/>';s+=label(k*f,-20/scale,Math.abs(k)===2?'2F':'F')}s+=label(0,-20/scale,'O');s+=label(450/scale,12/scale,'主軸');const tick=scale>=8?5:scale>=2?20:100;for(let t=-Math.floor(limit/tick)*tick;t<=limit;t+=tick){if(t===0)continue;s+=line(t,-31/scale,t,-37/scale,'#91a7ba',1);s+=label(t,-53/scale,Math.abs(t)+' cm','#71879a');}
s+='<g clip-path="url(#clip)">';const rays=[[h,-h/F,'#dc3535'],[0,-h/u,'#15804c'],[inf?null:h*F/(F-u),0,'#2563eb']];
for(let i=0;i<3;i++){const [a,b,c]=rays[i];if(a===null||!$('r'+i).checked)continue;s+=line(-u,h,0,a,c,2.8);s+=line(0,a,limit,a+b*limit,c,2.8);
function dir(x1,y1,x2,y2){const dx=px(x2)-px(x1),dy=py(y2)-py(y1),L=Math.hypot(dx,dy);if(L<12)return '';const x=px(x1)+dx*.55,y=py(y1)+dy*.55,ux=dx/L,uy=dy/L;return '<path d="M'+(x-9*ux-4*uy)+' '+(y-9*uy+4*ux)+' L'+x+' '+y+' L'+(x-9*ux+4*uy)+' '+(y-9*uy-4*ux)+'" fill="none" stroke="'+c+'" stroke-width="2.5"/>'}
s+=dir(-u,h,0,a)+dir(0,a,Math.min(limit,Math.abs(b)>1e-9?(b>0?Math.max(0,(240/scale-a)/b):Math.max(0,(-240/scale-a)/b)):limit),a+b*Math.min(limit,Math.abs(b)>1e-9?(b>0?Math.max(0,(240/scale-a)/b):Math.max(0,(-240/scale-a)/b)):limit));if(playing)s+='<circle r="5" fill="'+c+'"><animateMotion dur="2.5s" repeatCount="indefinite" path="M'+px(-u)+' '+py(h)+' L'+X+' '+py(a)+' L'+px(limit)+' '+py(a+b*limit)+'"/></circle>';if(v<0&&$('ext').checked)s+=line(0,a,Math.max(-limit,v),a+b*Math.max(-limit,v),c,2,'6 5');}
function arrow(x,y,c,d='',name=''){const xx=px(x),yy=py(y),sign=Math.sign(y);return line(x,0,x,y,c,5,d)+'<path d="M'+(xx-9)+' '+(yy+sign*13)+' L'+xx+' '+yy+' L'+(xx+9)+' '+(yy+sign*13)+'" fill="'+c+'"/>'+label(x,y+sign*19/scale,name,c)}
if($('screen').checked){s+=line(sd,-185/scale,sd,185/scale,'#64748b',5,'8 4');s+=label(sd,200/scale,'光屏');}s+=arrow(-u,h,'#18334e','','物體');if(!inf&&show)s+=arrow(v,m*h,'#9333b5',v<0?'6 4':'',v<0?'虛像':'實像');s+='</g><rect id="handle" x="'+(px(-u)-18)+'" y="'+(py(h)-15)+'" width="36" height="'+(h*scale+30)+'" fill="transparent" style="cursor:grab"/>';if($('screen').checked)s+='<rect id="screenHandle" x="'+(px(sd)-12)+'" y="70" width="24" height="380" fill="transparent" style="cursor:ew-resize"/>';svg.innerHTML=s;$('screenNote').textContent=$('screen').checked?(inf||v<0?'光屏：無法承接清晰實像。':Math.abs(sd-v)<=.2?'光屏：已對焦，可承接清晰實像。':'光屏：未對焦，影像模糊（示意）。'):'';
$('results').hidden=!show;$('type').textContent=inf?'無有限成像':v>0?'倒立實像':'正立虛像';$('size').textContent=inf?'—':Math.abs(Math.abs(m)-1)<1e-8?'等大':Math.abs(m)>1?'放大':'縮小';$('dist').textContent=inf?'∞':Math.abs(v).toFixed(2)+' cm';$('mag').textContent=inf?'—':Math.abs(m).toFixed(2)+' 倍';$('note').textContent=inf?'物體位於凸透鏡焦點，出射光線平行，第三條特殊光線無有限入射交點。':(v>0?'折射光線實際交會，可用光屏承接。':'反向延長線交會於物體同側，不能用光屏承接。')+(Math.abs(v)*scale>480||Math.abs(m*h)*scale>240?' 成像超出畫面範圍。':'');
}
document.querySelectorAll('input,select').forEach(e=>e.addEventListener('input',render));document.querySelectorAll('[data-k]').forEach(e=>e.onclick=()=>{$('u').value=(+$('f').value*+e.dataset.k).toFixed(1);render()});$('reset').onclick=()=>{$('u').value=15;$('f').value=10;$('h').value=3;$('kind').value=1;document.querySelectorAll('input[type=checkbox]').forEach(e=>e.checked=e.id!=='screen');$('sd').value=30;playing=false;$('animate').textContent='播放光線動畫';render()};$('full').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen?.().catch(()=>{})};svg.addEventListener('pointerdown',e=>{if(!['handle','screenHandle'].includes(e.target.id))return;drag=e.target.id;dragScale=scale;svg.setPointerCapture(e.pointerId)});svg.addEventListener('pointermove',e=>{if(!drag)return;const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;const q=p.matrixTransform(svg.getScreenCTM().inverse());if(drag==='screenHandle')$('sd').value=Math.max(1,Math.min(100,(q.x-X)/dragScale)).toFixed(1);else $('u').value=Math.max(2,Math.min(40,(X-q.x)/dragScale)).toFixed(1);render()});for(const event of ['pointerup','pointercancel','lostpointercapture'])svg.addEventListener(event,()=>{drag=false;render()});$('animate').onclick=()=>{playing=!playing;$('animate').textContent=playing?'停止光線動畫':'播放光線動畫';render()};$('focus').onclick=()=>{const u=+$('u').value,F=+$('f').value*+$('kind').value,v=F*u/(u-F);$('screen').checked=true;if(Number.isFinite(v)&&v>0){$('sd').max=Math.max(100,Math.ceil(v));$('sd').value=v.toFixed(1)}render()};render();
</script></html>
