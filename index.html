<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>宇哥資優自然｜透鏡成像實驗室</title><style>
*{box-sizing:border-box}body{margin:0;background:#edf4fa;color:#18334e;font:17px/1.6 system-ui,sans-serif}main{max-width:1200px;margin:auto;padding:20px}header{background:#143d60;color:white;padding:24px;border-radius:18px}h1{margin:0;font-size:clamp(24px,4vw,36px)}section{background:white;border-radius:16px;padding:18px;margin-top:16px;box-shadow:0 3px 16px #173d6012}svg{width:100%;height:auto;display:block;touch-action:none;background:#f8fbff;border-radius:12px}button,select{font:inherit;padding:8px 14px;border:1px solid #adc5d8;border-radius:9px;background:white;color:#18334e;cursor:pointer}button:hover{background:#e2f1ff}input[type=range]{width:100%;accent-color:#147ca8}.controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px}.buttons{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.results{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}.results div{background:#edf5fb;padding:12px;border-radius:10px}.results strong{display:block;font-size:22px}label{display:block}small{color:#526d85} .legend{display:flex;flex-wrap:wrap;gap:16px} </style><main><header><small style="color:#c7e6ff">宇哥資優自然 · 八年級理化</small><h1>透鏡成像互動實驗室</h1>拖曳物體，探索光線與成像的關係。</header><section><div class="controls"><label>透鏡種類<select id="kind"><option value="1">凸透鏡</option><option value="-1">凹透鏡</option></select></label><label>物距：<output id="uo"></output> cm<input id="u" type="range" min="2" max="40" step=".1" value="15"></label><label>焦距：<output id="fo"></output> cm<input id="f" type="range" min="5" max="15" step=".1" value="10"></label><label>物高：<output id="ho"></output> cm<input id="h" type="range" min="1" max="5" step=".1" value="3"></label></div><div class="buttons" id="presets"><button data-k="2.5">2F 外</button><button data-k="2">2F 上</button><button data-k="1.5">F～2F</button><button data-k="1">F 上</button><button data-k=".6">F 內</button><button id="reset">重設</button><button id="full">全螢幕</button></div><svg id="scene" viewBox="0 0 1000 520" aria-label="透鏡光路圖"></svg><div class="legend"><label style="color:#dc3535"><input type="checkbox" id="r0" checked>平行主軸</label><label style="color:#15804c"><input type="checkbox" id="r1" checked>通過鏡心</label><label style="color:#2563eb"><input type="checkbox" id="r2" checked>通過焦點方向</label><label><input type="checkbox" id="ext" checked>虛像延長線</label><label><input type="checkbox" id="answer" checked>顯示答案</label></div></section><section id="results"><div class="results"><div>成像性質<strong id="type"></strong></div><div>大小<strong id="size"></strong></div><div>像距<strong id="dist"></strong></div><div>倍率<strong id="mag"></strong></div></div><p id="note"></p></section><section><b>三條特殊光線</b><p>凸透鏡：平行主軸的光線折射後通過另一側焦點；通過鏡心的光線方向不變；通過物體側焦點（或其延長線）的光線折射後平行主軸。凹透鏡：平行入射光的反向延長線通過同側焦點；鏡心光線直行；朝另一側焦點入射的光線折射後平行主軸。</p><small>採理想薄透鏡模型，非厚透鏡的精確折射模擬。虛線表示光線反向延長線。</small></section></main><script>
const $=id=>document.getElementById(id),svg=$('scene'),X=500,Y=260;let scale=10,drag=false;
function render(){const u=+$('u').value,f=+$('f').value,h=+$('h').value,F=f*+$('kind').value,inf=Math.abs(u-F)<1e-8,v=inf?Infinity:F*u/(u-F),m=-v/u,show=$('answer').checked;scale=Math.min(10,460/Math.max(u,2*f,Math.min(120,Math.abs(v)||0)),215/Math.max(h,Math.min(40,Math.abs(m*h)||0)));if(!Number.isFinite(scale))scale=10;
$('uo').value=u.toFixed(1);$('fo').value=f.toFixed(1);$('ho').value=h.toFixed(1);
const px=x=>X+x*scale,py=y=>Y-y*scale;let s='<defs><clipPath id="clip"><rect x="12" y="12" width="976" height="496"/></clipPath></defs>';
const line=(x1,y1,x2,y2,c,w=2,d='')=>'<line x1="'+px(x1)+'" y1="'+py(y1)+'" x2="'+px(x2)+'" y2="'+py(y2)+'" stroke="'+c+'" stroke-width="'+w+'" '+(d?'stroke-dasharray="'+d+'"':'')+'/>';
const label=(x,y,t,c='#344b60')=>'<text x="'+px(x)+'" y="'+py(y)+'" fill="'+c+'" text-anchor="middle" font-size="16">'+t+'</text>';
let limit=485/scale;s+=line(-limit,0,limit,0,'#8294a6',1.5);s+=F>0?'<path d="M500 35 Q550 260 500 485 Q450 260 500 35Z" fill="#c2e5fa" stroke="#4b9bcc" opacity=".8"/>':'<path d="M475 35 Q510 260 475 485 L525 485 Q490 260 525 35Z" fill="#c2e5fa" stroke="#4b9bcc" opacity=".8"/>';
s+=line(0,-220/scale,0,220/scale,'#76a9cc',1,'5 4');for(const k of [-2,-1,1,2]){s+='<circle cx="'+px(k*f)+'" cy="260" r="4" fill="#344b60"/>';s+=label(k*f,-20/scale,Math.abs(k)===2?'2F':'F')}s+=label(0,-20/scale,'O');
s+='<g clip-path="url(#clip)">';const rays=[[h,-h/F,'#dc3535'],[0,-h/u,'#15804c'],[inf?null:h*F/(F-u),0,'#2563eb']];
for(let i=0;i<3;i++){const [a,b,c]=rays[i];if(a===null||!$('r'+i).checked)continue;s+=line(-u,h,0,a,c,2.8);s+=line(0,a,limit,a+b*limit,c,2.8);if(v<0&&$('ext').checked)s+=line(0,a,Math.max(-limit,v),a+b*Math.max(-limit,v),c,2,'6 5');}
function arrow(x,y,c,d='',name=''){const xx=px(x),yy=py(y),sign=Math.sign(y);return line(x,0,x,y,c,5,d)+'<path d="M'+(xx-9)+' '+(yy+sign*13)+' L'+xx+' '+yy+' L'+(xx+9)+' '+(yy+sign*13)+'" fill="'+c+'"/>'+label(x,y+sign*19/scale,name,c)}
s+=arrow(-u,h,'#18334e','','物體');if(!inf&&show)s+=arrow(v,m*h,'#9333b5',v<0?'6 4':'',v<0?'虛像':'實像');s+='</g><rect id="handle" x="'+(px(-u)-18)+'" y="'+(py(h)-15)+'" width="36" height="'+(h*scale+30)+'" fill="transparent" style="cursor:grab"/>';svg.innerHTML=s;
$('results').hidden=!show;$('type').textContent=inf?'無有限成像':v>0?'倒立實像':'正立虛像';$('size').textContent=inf?'—':Math.abs(Math.abs(m)-1)<1e-8?'等大':Math.abs(m)>1?'放大':'縮小';$('dist').textContent=inf?'∞':Math.abs(v).toFixed(2)+' cm';$('mag').textContent=inf?'—':Math.abs(m).toFixed(2)+' 倍';$('note').textContent=inf?'物體位於凸透鏡焦點，出射光線平行，第三條特殊光線無有限入射交點。':(v>0?'折射光線實際交會，可用光屏承接。':'反向延長線交會於物體同側，不能用光屏承接。')+(Math.abs(v)*scale>480||Math.abs(m*h)*scale>240?' 成像超出畫面範圍。':'');
}
document.querySelectorAll('input,select').forEach(e=>e.addEventListener('input',render));document.querySelectorAll('[data-k]').forEach(e=>e.onclick=()=>{$('u').value=(+$('f').value*+e.dataset.k).toFixed(1);render()});$('reset').onclick=()=>{$('u').value=15;$('f').value=10;$('h').value=3;$('kind').value=1;document.querySelectorAll('input[type=checkbox]').forEach(e=>e.checked=true);render()};$('full').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen?.().catch(()=>{})};svg.addEventListener('pointerdown',e=>{if(e.target.id!=='handle')return;drag=true;svg.setPointerCapture(e.pointerId)});svg.addEventListener('pointermove',e=>{if(!drag)return;const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;const q=p.matrixTransform(svg.getScreenCTM().inverse());$('u').value=Math.max(2,Math.min(40,(X-q.x)/scale)).toFixed(1);render()});for(const event of ['pointerup','pointercancel','lostpointercapture'])svg.addEventListener(event,()=>drag=false);render();
</script></html>
